name: Update formula

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. 0.12.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and checksum
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$PAYLOAD_VERSION}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sfL https://registry.npmjs.org/create-awesome-node-app/latest | jq -r '.version')
          fi
          URL="https://registry.npmjs.org/create-awesome-node-app/-/create-awesome-node-app-${VERSION}.tgz"
          TMP="$(mktemp)"
          SHA=""
          for attempt in $(seq 1 24); do
            if curl -sfL "$URL" -o "$TMP"; then
              SHA=$(sha256sum "$TMP" | cut -d' ' -f1)
              if [ -n "$SHA" ] && [ "$SHA" != "d41d8cd98f00b204e9800998ecf8427e" ]; then
                break
              fi
            fi
            echo "::warning::npm tarball not ready for create-awesome-node-app@${VERSION} (attempt ${attempt}/24); retrying in 15s"
            sleep 15
            SHA=""
          done
          rm -f "$TMP"
          if [ -z "$SHA" ] || [ "$SHA" = "d41d8cd98f00b204e9800998ecf8427e" ]; then
            echo "::error::Could not download or hash tarball at $URL" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"      >> "$GITHUB_OUTPUT"
          echo "url=$URL"         >> "$GITHUB_OUTPUT"
          echo "Resolved v${VERSION}"
          echo "  url=$URL"
          echo "  sha256=$SHA"

      - name: Patch formula
        env:
          FORMULA_URL: ${{ steps.meta.outputs.url }}
          FORMULA_SHA: ${{ steps.meta.outputs.sha256 }}
        run: |
          sed -i "s|url \".*\"|url \"${FORMULA_URL}\"|"     Formula/create-awesome-node-app.rb
          sed -i "s|sha256 \".*\"|sha256 \"${FORMULA_SHA}\"|" Formula/create-awesome-node-app.rb

      # main is branch-protected (PR + Formula lint required), so push the
      # bump to a branch and open a PR instead of committing to main.
      - name: Open formula update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORMULA_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="feat/formula-${FORMULA_VERSION}"
          git config user.name "Create Node App Bot"
          git config user.email "ulisescf.24@gmail.com"
          git checkout -B "$BRANCH"
          git add Formula/create-awesome-node-app.rb
          if git diff --cached --quiet; then
            echo "Formula already at v${FORMULA_VERSION}, nothing to do"
            exit 0
          fi
          git commit -m "feat: update formula to ${FORMULA_VERSION}"
          git push -u origin "$BRANCH"
          if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
            echo "Update PR already open for v${FORMULA_VERSION}"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "feat: update formula to ${FORMULA_VERSION}" \
              --body "Automated formula bump for create-awesome-node-app@${FORMULA_VERSION} (release dispatch)."
          fi
