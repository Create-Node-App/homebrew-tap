name: Formula lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  formula-lint:
    name: Formula lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ruby syntax check on all formulas
        run: |
          set -euo pipefail
          find Formula -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Formulas declare a Formula class
        run: |
          set -euo pipefail
          for f in Formula/*.rb; do
            grep -Eq '^class [A-Z][A-Za-z]+ < Formula' "$f" || {
              echo "::error::$f: no 'class ... < Formula' declaration found"
              exit 1
            }
          done
          echo "All formulas OK"

      - name: ShellCheck workflows
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          echo "ShellCheck version: $(shellcheck --version | head -1)"
          # Lint shell snippets in workflows (allow warnings but fail on errors)
          for wf in .github/workflows/*.yml; do
            echo "--- shellcheck $wf (syntax) ---"
            # Use --severity=error to surface real failures; warnings are informational
            shellcheck --severity=error --shell=bash --exclude=SC2148,SC2034,SC2154 "$wf" || {
              echo "::warning::$wf has shellcheck errors"
            }
          done

      - name: Version drift check (npm)
        run: |
          set -euo pipefail
          FORMULA_VER=$(grep -Eo 'create-awesome-node-app-[0-9]+\.[0-9]+\.[0-9]+\.tgz' Formula/*.rb | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          NPM_VER=$(curl -sfL https://registry.npmjs.org/create-awesome-node-app/latest | jq -r '.version')
          echo "Formula version: $FORMULA_VER"
          echo "npm latest: $NPM_VER"
          if [ "$FORMULA_VER" != "$NPM_VER" ]; then
            echo "::warning::Formula version ($FORMULA_VER) differs from npm latest ($NPM_VER) — packaging may lag release"
          else
            echo "Version sync OK: $FORMULA_VER"
          fi

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Brew audit (strict)
        continue-on-error: true
        run: |
          set -euo pipefail
          brew tap Create-Node-App/tap || true
          brew update || true
          brew audit --strict --online Create-Node-App/tap/create-awesome-node-app || brew audit --strict Create-Node-App/tap/create-awesome-node-app || brew audit --strict --tap Create-Node-App/tap || {
            echo "::warning::brew audit found issues (informational)"
          }
          echo "brew audit completed (informational)" 

      - name: Brew style
        continue-on-error: true
        run: |
          set -euo pipefail
          brew style Formula/*.rb || {
            echo "::warning::brew style found issues (informational)"
          }
          echo "brew style completed (informational)"

  url-sha-validation:
    name: URL + SHA256 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify formula url matches registry tarball sha256
        run: |
          set -euo pipefail
          FORMULA="$(ls Formula/*.rb | head -1)"
          URL="$(grep -Eo 'url "[^"]+"' "$FORMULA" | head -1 | cut -d'"' -f2)"
          EXPECTED="$(grep -Eo 'sha256 "[^"]+"' "$FORMULA" | head -1 | cut -d'"' -f2)"
          test -n "$URL" || { echo "::error::$FORMULA: no url found"; exit 1; }
          test -n "$EXPECTED" || { echo "::error::$FORMULA: no sha256 found"; exit 1; }
          echo "$URL" | grep -Eq 'https://registry\.npmjs\.org/create-awesome-node-app/-/create-awesome-node-app-[0-9]+\.[0-9]+\.[0-9]+\.tgz' || {
            echo "::error::$FORMULA: unexpected url format: $URL"
            exit 1
          }
          echo "$EXPECTED" | grep -Eq '^[0-9a-f]{64}$' || {
            echo "::error::$FORMULA: sha256 is not a 64-char hex digest"
            exit 1
          }
          TMP="$(mktemp)"
          curl -sfL "$URL" -o "$TMP"
          ACTUAL="$(sha256sum "$TMP" | cut -d' ' -f1)"
          rm -f "$TMP"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::$FORMULA: sha256 mismatch (formula=$EXPECTED registry=$ACTUAL)"
            exit 1
          fi
          echo "URL + SHA256 OK: $URL" 
